version: "3.9"

services:
  # ----------------------------------------------------------
  # FastAPI backend
  # ----------------------------------------------------------
  app:
    build: .
    container_name: crm-app
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/app/data/crm.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-0}
      - SEED_PRESET_USERS=${SEED_PRESET_USERS:-0}
      - INIT_ADMIN_USERNAME=${INIT_ADMIN_USERNAME:-admin}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD:-}
      - INIT_AGENT_USERNAME=${INIT_AGENT_USERNAME:-agent}
      - INIT_AGENT_PASSWORD=${INIT_AGENT_PASSWORD:-}
    volumes:
      - crm_data:/app/data
    networks:
      - crm_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # Nginx — serve frontend + reverse proxy /api
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: crm-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - crm_net

volumes:
  crm_data:

networks:
  crm_net:
    driver: bridge
