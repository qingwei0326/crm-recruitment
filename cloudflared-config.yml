# ============================================================
# Cloudflare Tunnel Configuration
# ============================================================
# Prerequisites:
#   1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
#   2. Authenticate: cloudflared tunnel login
#   3. Create tunnel:  cloudflared tunnel create crm-tunnel
#   4. DNS:           cloudflared tunnel route dns crm-tunnel crm.qing-wei.com
#   5. Run:           cloudflared tunnel run crm-tunnel
#
# Or one-shot quick tunnel (no config needed):
#   cloudflared tunnel --url http://127.0.0.1:8000
# ============================================================

tunnel: 5dd5b752-a226-4d4e-bb65-7a2541806a62
credentials-file: C:/Users/青微/.cloudflared/5dd5b752-a226-4d4e-bb65-7a2541806a62.json

ingress:
  # Map the public CRM domain to the local J1900 CRM service
  - hostname: crm.qing-wei.com
    service: http://127.0.0.1:8000

  # Default: 404 for unmatched hostnames
  - service: http_status:404
